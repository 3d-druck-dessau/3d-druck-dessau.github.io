# Shown on the home page (#faq) and on /faq/. Edit here, both update.
- q: Was kostet ein Prototyp?
  a: Einfache Prototypen gibt es ab 50 € zzgl. MwSt. Der genaue Preis hängt von Größe, Material und Druckzeit ab. Sie erhalten vorab immer einen Festpreis. Bei Serien sinkt der Stückpreis in der Regel mit der Menge.
- q: Welche Daten brauchen Sie?
  a: Am besten eine STEP-Datei. STL und 3MF funktionieren ebenfalls. Bei Passmaßen hilft eine Zeichnung mit Toleranzangaben. Ohne CAD-Daten konstruiere ich nach Zeichnung oder Skizze. Liegt nur ein Referenzteil vor, scanne ich es und baue es als CAD-Modell nach. Den Aufwand dafür weise ich im Angebot separat aus.
- q: Können Sie ein vorhandenes Teil nachbauen?
  a: Ja. Schicken Sie mir das Referenzteil oder bringen Sie es in Dessau-Roßlau vorbei. Ich scanne es, erstelle ein CAD-Modell und drucke danach ein Musterteil zur Prüfung. Auf Wunsch passe ich dabei Maße oder Schwachstellen an.
- q: Ab welcher Stückzahl lohnt sich 3D-Druck nicht mehr?
  a: Das hängt von Größe und Geometrie ab. Für Prototypen und Serien bis einige hundert Stück ist 3D-Druck meist die wirtschaftlichste Lösung. Bei höheren Stückzahlen wird Spritzguss irgendwann günstiger. Das sage ich Ihnen dann auch ehrlich.
- q: Wie schnell bekomme ich Teile?
  a: Prototypen sind oft nach wenigen Werktagen fertig. Für Serien vereinbaren wir einen festen Liefertermin. Ist eine Konstruktion nötig, plane ich diese Zeit im Angebot mit ein.
- q: Wie genau sind die Teile?
  a: Je nach Geometrie und Material sind etwa ±0,2 mm realistisch. Für feine Details nutze ich eine 0,4-mm-Düse, für große und stabile Bauteile bis zu 0,8 mm. Kritische Passungen sichern wir vorab mit einem Musterteil ab.
- q: Wie groß darf ein Bauteil sein?
  a: Am Stück bis zu 340 × 320 × 340 mm. Größere Bauteile teile ich konstruktiv auf und verbinde sie anschließend, zum Beispiel verschraubt oder verklebt.
- q: Behandeln Sie unsere Daten vertraulich?
  a: Ja. CAD-Daten und Zeichnungen verwende ich ausschließlich für Ihren Auftrag und gebe sie nicht weiter. Auf Wunsch unterzeichne ich vorab eine Geheimhaltungsvereinbarung (NDA).
- q: Liefern Sie oder kann ich abholen?
  a: Beides. Ich versende deutschlandweit per Paket. Unternehmen aus der Umgebung können Teile nach Absprache in Dessau-Roßlau abholen. Dabei lassen sich Musterteile auch direkt besprechen.
